<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prévia Alke</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EFE4CE;--bg2:#E8DBC0;--surface:#FAF4E6;--surface2:#F4EAD4;--ink:#332C23;--muted:#8C7E65;--gold:#A8823A;--gold2:#C19A4C;--goldsoft:#EADFC4;--line:#E2D4B8;--line2:#D8C7A4;--win:#5B8C5A;--warn:#C08A2E;--alert:#B5544E;--shadow:0 8px 24px rgba(40,28,20,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#d9cbb0;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:14px}
.note{max-width:420px;font-size:13px;color:#5f5440;text-align:center;margin:4px 0 12px}
.phone{width:100%;max-width:400px;height:min(86vh,780px);background:var(--bg);border-radius:30px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(40,28,20,.35);border:7px solid #2a2017;display:flex;flex-direction:column}
.scr{flex:1;overflow-y:auto;padding:14px 14px 78px}
.scr::-webkit-scrollbar{display:none}
h2.ph{font-size:21px;margin:4px 0 8px;font-weight:800}
.tags{display:flex;gap:8px;margin-bottom:10px;font-size:12px}
.tags span{padding:3px 10px;border-radius:999px;font-weight:600}
.srch{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:11px;padding:10px 12px;color:var(--muted);font-size:14px;margin-bottom:6px}
.srch svg{width:18px;height:18px;flex:0 0 auto}
/* lista conversas */
.warow{display:flex;gap:11px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;background:var(--goldsoft);color:var(--gold);font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.wmid{flex:1;min-width:0}.wl1{display:flex;align-items:center;gap:6px}
.wname{font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wprev{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wtime{font-size:11px;color:var(--muted);flex:0 0 auto}
.badge{background:var(--win);color:#fff;font-size:11.5px;font-weight:700;min-width:20px;height:20px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.unread{background:color-mix(in srgb,var(--win) 9%,transparent)}
.ck{color:var(--win);font-size:12px}
/* chat */
.chead{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.chead .nm{font-weight:700;line-height:1.1}.chead .ph{font-size:12px;color:var(--muted)}
.bub{max-width:76%;padding:9px 12px;border-radius:13px;font-size:14px;margin-bottom:8px;line-height:1.35;position:relative}
.bin{background:var(--surface);border:1px solid var(--line);align-self:flex-start;margin-right:auto}
.bout{background:color-mix(in srgb,var(--gold) 22%,var(--surface));margin-left:auto}
.bts{font-size:10px;color:var(--muted);text-align:right;margin-top:3px}
.msgs{display:flex;flex-direction:column;padding:12px 2px}
.aud{display:flex;align-items:center;gap:9px;min-width:195px}
.aud .pp{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#fff;border:0;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:13px}
.aud .wv{flex:1;display:flex;align-items:center;gap:2px;height:26px}
.aud .wv i{flex:1;background:var(--line2);border-radius:2px;min-width:2px}
.aud .wv i.on{background:var(--gold)}
.aud .tm{font-size:11px;color:var(--muted)}
.cfoot{display:flex;align-items:center;gap:4px;padding:9px 6px;border-top:1px solid var(--line);background:var(--surface)}
.cfoot .inp{flex:1;background:var(--surface2);border:1px solid var(--line2);border-radius:20px;padding:10px 14px;color:var(--muted);font-size:14px}
.ib{width:40px;height:40px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);background:none;border:0;flex:0 0 auto}
.ib svg{width:21px;height:21px}.ib.pri{background:var(--gold);color:#fff}
.recbar{display:flex;align-items:center;gap:10px;flex:1;padding:4px}
.rdot{width:11px;height:11px;border-radius:50%;background:var(--alert);animation:p 1s infinite}@keyframes p{50%{opacity:.25}}
/* funil */
.selrow{display:flex;gap:8px;align-items:center;margin:10px 0 12px}
.selrow .nav{width:40px;height:40px;border-radius:11px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:18px;flex:0 0 auto}
.selbtn{flex:1;display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line2);border-radius:11px;padding:11px 14px;font-weight:700;font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(40,28,20,.05)}
.card .nm{font-weight:700;margin-bottom:6px}
.svl{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin:3px 0}
.chip{display:inline-flex;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--goldsoft);color:var(--gold);margin-top:7px}
.chip.al{background:color-mix(in srgb,var(--alert) 15%,transparent);color:var(--alert)}
/* bottom nav */
.bn{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -2px 14px rgba(40,28,20,.07)}
.bn button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 11px;color:var(--muted);font-size:10px;font-weight:600;font-family:inherit;position:relative}
.bn button.on{color:var(--gold)}.bn button svg{width:23px;height:23px}
.bn .dot{position:absolute;top:6px;left:calc(50% + 6px);width:8px;height:8px;border-radius:50%;background:var(--win);border:1.5px solid var(--surface)}
.hide{display:none}
</style></head><body>
<div class="note">Prévia das telas novas — toque na barra de baixo pra navegar. É só visual (dados de exemplo).</div>
<div class="phone">
  <div class="scr" id="scr"></div>
  <nav class="bn" id="bn"></nav>
</div>
<script>
var I={home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>',chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8 8 0 0 1-11.5 7.2L3 21l2.3-6.5A8 8 0 1 1 21 11.5Z"/></svg>',funnel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8.5V20l-4-2v-4.5L3 5Z"/></svg>',people:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.3"/><path d="M5 20c0-3.4 3.1-5.5 7-5.5s7 2.1 7 5.5"/></svg>',cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.2"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/></svg>',more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="12.5" rx="2.4"/><path d="M8 7l1.6-2.6h4.8L16 7"/><circle cx="12" cy="13.2" r="3.1"/></svg>',mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>',send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"/></svg>',back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>',dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>'};
function wave(n,act){var s='';for(var i=0;i<n;i++){var h=28+Math.round(55*Math.abs(Math.sin(i*1.7+.5)));s+='<i class="'+(i<act?'on':'')+'" style="height:'+h+'%"></i>';}return s;}
var convs=[
 {n:'Heloara Oliveira',img:1,p:'[áudio]',t:'17:34',u:0},
 {n:'Alexia Nunes',i:'AN',p:'Obrigada 💛',t:'17:26',u:2},
 {n:'Kênia Meire',i:'KM',p:'Comprovante.pdf',t:'17:08',u:1},
 {n:'Tatiana',img:2,p:'[foto]',t:'16:59',u:0},
 {n:'Elizângela França',i:'EF',p:'Quais seus horários?',t:'16:44',u:0},
 {n:'Cliente 8374',i:'C',p:'Oi, tudo bem?',t:'ontem',u:0}];
function elConvs(){var h='<h2 class="ph">Conversas</h2><div class="tags"><span style="background:var(--goldsoft);color:var(--gold)">6 conversas</span><span style="background:var(--win);color:#fff">3 não lidas</span></div><div class="srch">'+I.search+'<span>Buscar conversa</span></div>';
 convs.forEach(function(c){h+='<div class="warow '+(c.u?'unread':'')+'" onclick="go(\'chat\')"><div class="av">'+(c.img?'<img src="https://i.pravatar.cc/80?img='+(c.img==1?47:45)+'">':c.i)+'</div><div class="wmid"><div class="wl1"><span class="wname">'+c.n+'</span>'+(c.u?'<span class="badge">'+c.u+'</span>':'')+'</div><div class="wprev">'+c.p+'</div></div><div class="wtime"><span class="ck">✓✓</span> '+c.t+'</div></div>';});
 return h;}
function elChat(){return '<div class="chead"><button class="ib" onclick="go(\'conversas\')">'+I.back+'</button><div class="av"><img src="https://i.pravatar.cc/80?img=47"></div><div style="flex:1"><div class="nm">Heloara Oliveira</div><div class="ph">(31) 99197-0600</div></div><button class="ib">'+I.dots+'</button></div>'+
 '<div class="msgs">'+
 '<div class="bub bin">Oi! Quais seus horários disponíveis pra sobrancelha?<div class="bts">16:06</div></div>'+
 '<div class="bub bin" style="min-width:210px"><div class="aud"><div class="pp">▶</div><div class="wv">'+wave(22,8)+'</div><div class="tm">0:14</div></div><div class="bts">16:07</div></div>'+
 '<div class="bub bout">Oii 💛 Temos sim! Amanhã às 14:30 fica bom pra você?<div class="bts">Vitória · 16:20</div></div>'+
 '<div class="bub bin"><img src="https://i.pravatar.cc/240?img=32" style="width:180px;border-radius:9px;display:block"><div class="bts">16:22</div></div>'+
 '<div class="bub bout">Perfeito, agendado! Te espero 🥰<div class="bts">Vitória · 16:25 <span class="ck">✓✓</span></div></div>'+
 '</div>'+
 '<div class="cfoot"><button class="ib">'+I.plus+'</button><div class="inp">Mensagem</div><button class="ib">'+I.camera+'</button><button class="ib">'+I.mic+'</button></div>';}
function elChatRec(){return '<div class="chead"><button class="ib" onclick="go(\'conversas\')">'+I.back+'</button><div class="av"><img src="https://i.pravatar.cc/80?img=47"></div><div style="flex:1"><div class="nm">Heloara Oliveira</div><div class="ph">gravando áudio…</div></div></div>'+
 '<div class="msgs" style="flex:1"></div>'+
 '<div class="cfoot"><div class="recbar"><span class="rdot"></span><span style="font-size:14px;font-variant-numeric:tabular-nums">0:03</span><span style="flex:1;color:var(--muted);font-size:13px">Gravando…</span><button class="ib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><button class="ib pri">'+I.send+'</button></div></div>';}
function elFunil(){var cards=[['Alexia Nunes','AN','Instagram','5 dias sem resposta',1],['Kênia Meire','KM','WhatsApp','',0],['Juliana','J','Indicação','2 dias sem resposta',1]];
 var h='<h2 class="ph">Funil</h2><div class="srch">'+I.search+'<span>Nome ou telefone</span></div>'+
 '<div class="selrow"><button class="nav">‹</button><button class="selbtn"><span>Follow-up</span><span style="color:var(--muted);font-weight:600">135 ▾</span></button><button class="nav">›</button></div>';
 cards.forEach(function(c){h+='<div class="card"><div class="nm">'+c[0]+'</div><div class="svl">'+I.chat.replace('width="24"','')+' <span>veio por '+c[2]+'</span></div>'+(c[4]?'<span class="chip al">⏳ '+c[3]+'</span>':'<span class="chip">sem serviço</span>')+'</div>';});
 return h;}
var screens={conversas:elConvs,chat:elChat,funil:elFunil,inicio:function(){return '<h2 class="ph">Início</h2><div class="note" style="text-align:left">A home com os cartões (faturado, leads, a confirmar) entra na próxima leva.</div>';}};
function go(s){document.getElementById('scr').innerHTML=screens[s]?screens[s]():'<h2 class="ph">Em breve</h2>';document.getElementById('scr').scrollTop=0;draw(s);}
function draw(active){var items=[['inicio','Início',I.home],['conversas','Conversas',I.chat,1],['funil','Funil',I.funnel],['clientes','Clientes',I.people],['cal','Agenda',I.cal],['mais','Mais',I.more]];
 var h='';items.forEach(function(it){var on=(it[0]===active)||(active==='chat'&&it[0]==='conversas');h+='<button class="'+(on?'on':'')+'" onclick="go(\''+it[0]+'\')">'+it[2]+(it[3]?'<span class="dot"></span>':'')+'<span>'+it[1]+'</span></button>';});
 document.getElementById('bn').innerHTML=h;}
// botão extra: ver gravação de áudio
go('conversas');
setTimeout(function(){var b=document.createElement('div');b.className='note';b.innerHTML='<button onclick="document.getElementById(\'scr\').innerHTML=elChatRec();" style="margin-top:8px;padding:8px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);font-weight:600;font-family:inherit">Ver a barra de gravação de áudio</button>';document.querySelector('.phone').after(b);},60);
</script></body></html>
