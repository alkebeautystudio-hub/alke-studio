<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alke Beauty Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFE4CE; --bg2:#E8DBC0; --surface:#FAF4E6; --surface2:#F4EAD4;
  --ink:#332C23; --muted:#8C7E65; --gold:#A8823A; --gold2:#C19A4C; --goldsoft:#EADFC4;
  --line:#E2D4B8; --line2:#D8C7A4; --wine:#7A4A52;
  --win:#5B8C5A; --warn:#C08A2E; --alert:#B5544E;
  --disp:'Outfit','Inter',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif; --brand:'Cormorant Garamond',Georgia,serif;
  --shadow:0 1px 2px rgba(51,44,35,.05),0 10px 30px rgba(51,44,35,.07);
}
@media (prefers-color-scheme:dark){:root[data-theme="__autodark_off__"]{
  --bg:#1E1913; --bg2:#19140F; --surface:#272019; --surface2:#2F271E;
  --ink:#F1E7D6; --muted:#B0A185; --gold:#C8A25A; --gold2:#D9B874; --goldsoft:#3A2F1E;
  --line:#3A3122; --line2:#473C29; --win:#7CB07A; --warn:#D9A84E; --alert:#D98B84;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1E1913; --bg2:#19140F; --surface:#272019; --surface2:#2F271E;
  --ink:#F1E7D6; --muted:#B0A185; --gold:#C8A25A; --gold2:#D9B874; --goldsoft:#3A2F1E;
  --line:#3A3122; --line2:#473C29; --win:#7CB07A; --warn:#D9A84E; --alert:#D98B84;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1100px 640px at 50% -240px, var(--surface), var(--bg) 62%) fixed;color:var(--ink);font-family:var(--body);font-size:14px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--disp);font-weight:600;margin:0;letter-spacing:.2px}
button,input,select,textarea{font-family:var(--body);font-size:14px}
button{cursor:pointer}
.gold{color:var(--gold)}
.serif{font-family:var(--disp)}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
.muted{color:var(--muted)}
/* ====== LOGIN ====== */
#login{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% -10%,var(--surface),var(--bg) 60%)}
.loginbox{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:36px 30px;text-align:center}
.wordmark{font-family:var(--brand);font-size:38px;letter-spacing:.32em;color:var(--gold);font-weight:600;padding-left:.32em}
.wordmark small{display:block;font-size:11px;letter-spacing:.42em;color:var(--muted);margin-top:4px;padding-left:.42em;font-family:var(--body);font-weight:500}
.arc{width:70px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px auto 22px}
#login input{width:100%;padding:13px 14px;border:1px solid var(--line2);border-radius:11px;background:var(--bg);color:var(--ink);margin-bottom:11px}
#login input:focus{outline:2px solid var(--gold);outline-offset:1px}
.btn{border:1px solid var(--gold);background:var(--gold);color:#fff;border-radius:11px;padding:12px 18px;font-weight:600;box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface);color:var(--gold)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.loginmsg{min-height:18px;font-size:13px;color:var(--alert);margin-top:8px}
/* ====== APP SHELL ====== */
#app{display:none;min-height:100%}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--bg2);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .mark{font-family:var(--brand);font-size:24px;letter-spacing:.28em;color:var(--gold);font-weight:600;padding:6px 10px 2px .28em}
.side .mark small{display:block;font-family:var(--body);font-size:9px;letter-spacing:.38em;color:var(--muted);font-weight:500;padding-left:.1em}
.navsep{height:1px;background:var(--line);margin:12px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--ink);border:none;background:none;width:100%;text-align:left;font-weight:500;font-size:14px}
.nav .ic{width:17px;text-align:center;opacity:.8}
.nav:hover{background:var(--surface2)}
.nav.on{background:var(--surface);box-shadow:var(--shadow);color:var(--gold);font-weight:600}
.side .who{margin-top:auto;padding:12px 10px;border-top:1px solid var(--line);font-size:13px}
.side .who b{display:block}
.content{min-width:0;padding:22px clamp(16px,3vw,34px);padding-left:max(16px,env(safe-area-inset-left))}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.topbar h2{font-size:30px}
.topbar .sub{color:var(--muted);font-size:13px}
.spacer{margin-left:auto}
/* mobile top nav */
.mtop{display:none}
.drawov{display:none}
/* ====== FUNIL ====== */
.kstats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.kstat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.kstat b{font-family:var(--disp);font-size:18px}
.kstat .d{width:8px;height:8px;border-radius:50%}
.board{display:flex;gap:13px;overflow-x:auto;padding:14px 2px 10px}
.col{flex:0 0 275px;min-width:275px;background:var(--surface2);border:1px solid var(--line);border-radius:15px;display:flex;flex-direction:column}
.col.drop{outline:2px dashed var(--gold);outline-offset:-4px;background:var(--goldsoft)}
.card[draggable]{cursor:grab}.card[draggable]:active{cursor:grabbing}
.colh{display:flex;align-items:center;justify-content:space-between;padding:13px 14px 7px}
.colh b{font-family:var(--disp);font-size:16px;font-weight:600}
.pill{font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--muted);font-variant-numeric:tabular-nums}
.cards{display:flex;flex-direction:column;gap:9px;padding:3px 10px 13px;min-height:30px}
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow);cursor:pointer;transition:transform .08s,box-shadow .12s}
.card:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(51,44,35,.07),0 14px 32px rgba(51,44,35,.1)}
.card .nm{font-weight:600;font-size:14.5px}
.card .mini{font-size:12px;color:var(--muted);margin-top:3px}
.card .svline{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink);margin-top:4px}
.card .svline .svic{width:13px;flex:0 0 auto;font-weight:700;text-align:center}
.card .svline .svtx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .svline .svdt{flex:0 0 auto;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.card .svline .svval{margin-left:auto;color:var(--win);font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto}
.svrow{padding:11px 0;border-bottom:1px solid var(--line)}.svrow:last-child{border-bottom:0}
.bdaycols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.bdaycol{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 12px;min-width:0}
.bdaycol .eyebrow{display:block;margin-bottom:4px}
.bdayrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.bdaycol .bdayrow:last-child{border-bottom:0}
.bdayrow.today{background:var(--goldsoft);border-radius:8px;padding:7px 9px;border-bottom:0;margin:3px 0}
.bdaybanner{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:12px;background:var(--goldsoft);margin-bottom:12px}
@media(max-width:640px){.bdaycols{grid-template-columns:1fr}}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.tag.org{background:var(--goldsoft);color:var(--gold)}
.tag.al{background:color-mix(in srgb,var(--alert) 15%,transparent);color:var(--alert)}
.tag.wn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tag.money{background:color-mix(in srgb,var(--win) 15%,transparent);color:var(--win);font-variant-numeric:tabular-nums}
.qa{display:flex;gap:6px;margin-top:9px}
.qb{flex:1;border:1px solid var(--line2);background:var(--bg);border-radius:8px;padding:6px;font-size:12px;font-weight:600;color:var(--muted)}
.qb.go{color:var(--gold);border-color:var(--gold)} .qb.ok{color:var(--win)} .qb.no{color:var(--muted)}
/* ====== CARDS/TILES ====== */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:13px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow)}
.tile .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--disp);font-size:30px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums}
.tile .v.pos{color:var(--win)} .tile .v.neg{color:var(--alert)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow);margin-top:16px}
.panel h3{font-size:18px;margin-bottom:3px}
.panel.caixa{background:linear-gradient(160deg,var(--goldsoft),var(--surface))}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.rowline:last-child{border-bottom:none}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.listhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.srow{display:grid;grid-template-columns:1.6fr .9fr .6fr .7fr .7fr auto;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.srow .nm{font-weight:600}
.srow input{padding:6px 8px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.soon{text-align:center;color:var(--muted);padding:50px 18px}
.soon .big{font-family:var(--disp);font-size:26px;color:var(--ink);margin-bottom:6px}
.agwrap{margin-top:14px;display:flex;overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.agcol{min-width:148px;flex:1;border-right:1px solid var(--line)}
.agcol.agtime{flex:0 0 48px;min-width:48px}
.agcol.wk{min-width:92px}
.rangebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.rangebar input{padding:8px 9px;border:1px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--ink);font-size:13px}
.rangebar .qk{border:1px solid var(--line2);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.rangebar .qk.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.segtog{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.segtog button{border:none;padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer;background:transparent;color:var(--muted)}
.segtog button.on{background:var(--gold);color:#fff}
.agcol:last-child{border-right:none}
.agh{background:var(--surface2);border-bottom:1px solid var(--line);padding:8px 6px;text-align:center;font-weight:600;font-size:12.5px;height:38px;white-space:nowrap;overflow:hidden}
.agbody{position:relative}
.aghour{height:54px;border-bottom:1px dashed var(--line)}
.agtime .aglabel{height:54px;font-size:10.5px;color:var(--muted);text-align:right;padding:2px 5px;box-sizing:border-box}
.agblk{position:absolute;left:3px;right:3px;border-radius:8px;padding:3px 7px;font-size:11.5px;line-height:1.25;overflow:hidden;cursor:pointer;color:var(--ink);border-left:3px solid var(--gold)}
.agblk b{display:block;font-size:12px;font-weight:600}
/* ====== MODAL ====== */
.ov{position:fixed;inset:0;background:rgba(40,28,20,.5);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:100%;max-width:460px;max-height:92vh;overflow:auto;padding:22px}
.modal h3{font-size:21px;margin-bottom:4px}
.modal.big{max-width:600px}
.stagepills{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.sp{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--bg);color:var(--muted);cursor:pointer}
.sp.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.f{display:flex;flex-direction:column;gap:5px;margin:12px 0}
.f label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;padding:10px 11px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);color:var(--ink)}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mactions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
a.lk{color:var(--gold);text-decoration:none;font-size:12.5px}
.chiprow{display:flex;gap:7px;flex-wrap:wrap}
. chip{}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;height:100vh;width:252px;z-index:60;transform:translateX(-105%);transition:transform .22s ease;box-shadow:0 0 50px rgba(40,28,20,.3)}
  .side.open{transform:translateX(0)}
  .drawov{display:none;position:fixed;inset:0;background:rgba(40,28,20,.45);z-index:55}
  .drawov.on{display:block}
  .mtop{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .mtop .burger{font-size:21px;background:none;border:none;color:var(--gold);cursor:pointer;line-height:1;padding:2px 4px}
  .mtop .mlogo{font-family:var(--brand);font-size:23px;letter-spacing:.3em;color:var(--gold);font-weight:600;padding-left:.3em}
  .topbar h2{font-size:25px}
  .two{grid-template-columns:1fr}
  .srow{grid-template-columns:1fr 1fr;gap:6px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="loginbox">
    <div class="wordmark">ALKE<small>BEAUTY STUDIO</small></div>
    <div class="arc"></div>
    <form id="loginform" autocomplete="on">
      <input id="email" type="email" placeholder="e-mail" autocomplete="username" required>
      <input id="senha" type="password" placeholder="senha" autocomplete="current-password" required>
      <button class="btn block" type="submit" id="loginbtn">Entrar</button>
    </form>
    <div class="loginmsg" id="loginmsg"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="shell">
    <aside class="side">
      <div class="mark">ALKE<small>BEAUTY STUDIO</small></div>
      <div class="navsep"></div>
      <nav id="nav"></nav>
      <div class="who" id="who"></div>
    </aside>
    <div class="drawov" id="drawov"></div>
    <div style="min-width:0">
      <div class="mtop" id="mtop"></div>
      <main class="content" id="view"></main>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL="https://rzgbzwczfdjhbheofwsz.supabase.co";
const SUPA_KEY="sb_publishable_J24k3rnZfDOh0I0xT61LYg__gQ74_t2";
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);

const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const fmt=v=>BRL.format(Number(v)||0);
const EL=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const ORIGENS=["Instagram (anúncio)","Instagram (orgânico)","Indicação","WhatsApp","Google","Passou na porta","Outro"];
const ETAPAS=[{k:'lead',l:'Lead'},{k:'conversa',l:'Em conversa'},{k:'followup',l:'Follow-up'},{k:'agendada',l:'Agendada'},{k:'retorno',l:'Retorno'},{k:'realizou',l:'Realizou'},{k:'naoveio',l:'Não veio'}];
const monthKey=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')};

const _mStart=new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().slice(0,10);
const _mEnd=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).toISOString().slice(0,10);
const S={me:null,pros:[],servicos:[],precos:{},leads:[],fin:{},config:{custo_total_mes:0},despesas:[],agendamentos:[],agDay:new Date().toISOString().slice(0,10),agView:'dia',dashFrom:_mStart,dashTo:_mEnd,meuDiaPro:null,tab:'funil',month:monthKey(Date.now())};

// ---------- AUTH ----------
document.getElementById('loginform').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('loginbtn'), msg=document.getElementById('loginmsg');
  btn.textContent='Entrando…'; msg.textContent='';
  const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:senha.value});
  btn.textContent='Entrar';
  if(error){msg.textContent='E-mail ou senha incorretos.';return;}
  boot();
});
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){document.getElementById('login').style.display='grid';document.getElementById('app').style.display='none';return;}
  // carrega "quem sou eu"
  const {data:me}=await sb.from('profissionais').select('*').eq('user_id',session.user.id).maybeSingle();
  S.me=me||{nome:session.user.email,admin:false,socia:false};
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  await loadAll(); renderShell(); render();
}
async function loadAll(){
  const [pros,serv,prec,leads,fin,cfg,desp,ags]=await Promise.all([
    sb.from('profissionais').select('*').order('ordem'),
    sb.from('servicos').select('*').order('nome'),
    sb.from('servicos_preco').select('*'),
    sb.from('leads').select('*').order('criado_em',{ascending:false}),
    sb.from('financeiro').select('*'),
    sb.from('studio_config').select('*').eq('id',1).maybeSingle(),
    sb.from('despesas').select('*'),
    sb.from('agendamentos').select('*'),
  ]);
  S.pros=pros.data||[]; S.servicos=serv.data||[];
  S.precos={}; (prec.data||[]).forEach(p=>S.precos[p.servico_id]=p);
  S.leads=leads.data||[];
  S.fin={}; (fin.data||[]).forEach(f=>S.fin[f.lead_id]=f);
  S.config=cfg.data||{custo_total_mes:0};
  S.despesas=desp.data||[];
  S.agendamentos=ags.data||[];
}
const proById=id=>S.pros.find(p=>p.id===id)||{};
const servById=id=>S.servicos.find(s=>s.id===id)||{};
const isAdmin=()=>!!S.me.admin;
const isSocia=()=>!!S.me.socia;
const canMoney=proId=>isAdmin()||S.me.id===proId;
const canPreco=()=>isAdmin()||isSocia();            // quem vê/edita preço e custo do catálogo
const pctPro=p=>{const v=Number((p||{}).percentual);return isNaN(v)?30:v};
const permOf=(p,key)=>{const pm=(p&&p.permissoes)||{}; if(key==='funil')return pm.funil!==false; return !!pm[key];};
const canTab=key=>{ if(isAdmin()||isSocia())return true; if(key==='funil')return permOf(S.me,'funil'); if(key==='conversas')return permOf(S.me,'conversas'); if(key==='servicos')return permOf(S.me,'servicos'); return true; };
// valor que o usuário atual PODE ver: sócia/admin veem bruto; profissional vê o líquido dela (já com a % descontada)
const valorMostra=a=>{const v=valorAt(a); if(v==null)return null; if(isAdmin()||isSocia())return v; return v*(1-pctPro(S.me)/100);};
const precoDe=l=>{const p=S.precos[l.servico_id];return p?Number(p.preco):null};
const custoDe=l=>{const p=S.precos[l.servico_id];return p?Number(p.custo):0};
const valorFinal=l=>{const pr=precoDe(l);return pr==null?null:pr-(Number(l.desconto)||0)};

function leadAlert(l){
  if(l.etapa==='retorno' && l.retorno){const dd=Math.ceil((new Date(l.retorno+'T00:00:00')-new Date())/864e5); if(dd<=0)return{cls:'al',txt:'retorno atrasado'}; if(dd<=7)return{cls:'wn',txt:'retorno em '+dd+'d'};}
  if(l.etapa==='realizou' && !l.retorno && l.realizado_em){const dias=Math.floor((new Date()-new Date(l.realizado_em))/864e5); if(dias>=40)return{cls:'al',txt:dias+' dias parada'}; if(dias>=20)return{cls:'wn',txt:dias+' dias parada'};}
  if(l.proxima_acao_em && new Date(l.proxima_acao_em)<new Date()) return {cls:'al',txt:'atrasado'};
  if((l.etapa==='conversa'||l.etapa==='followup') && !l.proxima_acao_em) return {cls:'wn',txt:'responder'};
  return null;
}

async function move(l,etapa){
  const upd={etapa,atualizado_em:new Date().toISOString()};
  if(etapa==='realizou'&&!l.realizado_em) upd.realizado_em=new Date().toISOString();
  await sb.from('leads').update(upd).eq('id',l.id);
  await loadAll(); render();
}
// recalcula a etapa do card a partir dos serviços:
// tem serviço pendente -> Agendada; todos realizados -> Realizou; sobrou falta -> Não veio
async function recomputeEtapa(leadId){
  const l=S.leads.find(x=>x.id===leadId); if(!l) return;
  const servs=servicosDoLead(leadId);
  if(!servs.length) return; // sem serviço: mantém etapa manual (lead/conversa/followup)
  const pend=servs.filter(a=>a.status==='marcado').length;
  const real=servs.filter(a=>a.status==='realizado').length;
  let etapa = pend>0 ? 'agendada' : (real===servs.length ? 'realizou' : 'naoveio');
  // realizou + data de retorno marcada -> vai pra coluna Retorno
  if(etapa==='realizou' && l.retorno) etapa='retorno';
  if(l.etapa===etapa) return;
  const upd={etapa,atualizado_em:new Date().toISOString()};
  if((etapa==='realizou'||etapa==='retorno')&&!l.realizado_em) upd.realizado_em=new Date().toISOString();
  await sb.from('leads').update(upd).eq('id',leadId);
}
// marca UM serviço (agendamento) como realizado/faltou, de dentro do card
async function marcarServico(agId,status,leadId){
  await sb.from('agendamentos').update({status,realizado_em:status==='realizado'?new Date().toISOString():null}).eq('id',agId);
  await loadAll();
  if(leadId){ await recomputeEtapa(leadId); await loadAll(); }
  document.querySelectorAll('.ov').forEach(o=>o.remove());
  render();
  if(leadId) openLead(leadId);
}

// info de aniversário a partir do nascimento (lê a string Y-M-D direto, sem fuso)
function bdayInfo(nasc){
  if(!nasc) return null;
  const m=String(nasc).slice(0,10).split('-'); if(m.length<3) return null;
  const by=+m[0], bmo=+m[1]-1, bd=+m[2]; if(isNaN(bmo)||isNaN(bd)) return null;
  const now=new Date(); now.setHours(0,0,0,0);
  const monD=new Date(mondayOf(now.toISOString().slice(0,10))+'T00:00:00');
  const sun=new Date(monD); sun.setDate(sun.getDate()+6);
  const thisY=new Date(now.getFullYear(),bmo,bd);
  const today=(bmo===now.getMonth() && bd===now.getDate());
  const thisWeek=thisY>=monD && thisY<=sun;
  const thisMonth=(bmo===now.getMonth());
  let next=new Date(now.getFullYear(),bmo,bd); if(next<now) next=new Date(now.getFullYear()+1,bmo,bd);
  const daysTo=Math.round((next-now)/864e5);
  const age=by>1900?(next.getFullYear()-by):null;
  return {dia:bd,mes:bmo,today,thisWeek,thisMonth,daysTo,age};
}

function agGridTime(){
  const tc=EL('div','agcol agtime'); tc.appendChild(EL('div','agh'));
  const tb=EL('div','agbody'); for(let h=AG0;h<AG1;h++)tb.appendChild(Object.assign(EL('div','aglabel'),{textContent:String(h).padStart(2,'0')+'h'})); tc.appendChild(tb); return tc;

function layoutCol(evs){
  evs.forEach(a=>{a._s=new Date(a.inicio).getTime();a._e=a.fim?new Date(a.fim).getTime():a._s+1800000});
  evs.sort((a,b)=>a._s-b._s||a._e-b._e);
  let i=0;
  while(i<evs.length){
    let cl=[evs[i]],maxEnd=evs[i]._e,j=i+1;
    while(j<evs.length&&evs[j]._s<maxEnd){cl.push(evs[j]);maxEnd=Math.max(maxEnd,evs[j]._e);j++}
    const lanes=[];
    cl.forEach(e=>{let k=0;while(k<lanes.length&&lanes[k]>e._s)k++;e._lane=k;lanes[k]=e._e});
    cl.forEach(e=>e._total=lanes.length); i=j;
  }
  return evs;
}

    const stInfo=s=>{const u=(s||'').toUpperCase();if(u==='ACTIVE')return{t:'ativa',bg:'var(--win)'};if(u.indexOf('PAUSED')>=0)return{t:'pausada',bg:'var(--muted)'};if(!s)return null;return{t:u.toLowerCase().replace(/_/g,' '),bg:'var(--muted)'};};
    const periodo='Período: '+brDate(S.dashFrom,{day:'2-digit',month:'2-digit'})+' a '+brDate(S.dashTo,{day:'2-digit',month:'2-digit'});
    const summary=EL('div'); const pan=EL('div','panel');
    const paint=()=>{
      const sel=items.filter(c=>S.metaSel.size?S.metaSel.has(selKey(c)):true);
      const t=sel.reduce((s,c)=>({gasto:s.gasto+c.gasto,alcance:s.alcance+c.alcance,conv:s.conv+(c.conversas||0)+(c.leads||0)}),{gasto:0,alcance:0,conv:0});
      summary.innerHTML='';
      summary.appendChild(Object.assign(EL('div','muted'),{textContent:periodo+(S.metaSel.size?(' · '+S.metaSel.size+' '+titNiv+'(s) selecionada(s)'):' · todas'),style:'font-size:12.5px;margin-bottom:8px'}));
      const g=EL('div','grid');
      g.appendChild(tile('Gasto no tráfego',fmt(t.gasto)));
      g.appendChild(tile('Alcance',nMil(t.alcance)));
      g.appendChild(tile('Conversas iniciadas',nMil(t.conv)));
      g.appendChild(tile('Faturamento do studio',fmt(fat),'pos'));
      summary.appendChild(g);
      const roas=t.gasto>0?(fat/t.gasto):0;
      const rb=EL('div'); rb.style.cssText='margin:12px 0 0;padding:13px 15px;border-radius:12px;background:var(--goldsoft);font-size:14px;line-height:1.5';
      rb.innerHTML='Gasto <b>'+fmt(t.gasto)+'</b> e faturamento do studio <b>'+fmt(fat)+'</b> no período.'+(t.gasto>0?(' Pra cada R$1 no tráfego, <b>'+roas.toFixed(1).replace('.',',')+'x</b> de volta.'):'');
      summary.appendChild(rb);
    };
    const drawList=()=>{
      pan.innerHTML='';
      const h=EL('div','listhead'); h.appendChild(EL('h3',null,'Por '+titNiv));
      if(S.metaSel.size){const cl=EL('button','btn ghost sm','Limpar seleção');cl.onclick=()=>{S.metaSel.clear();drawList();paint()};h.appendChild(cl);}
      pan.appendChild(h);
      if(!items.length){pan.appendChild(EL('p','muted','Sem dados no período.'));return;}
      items.forEach(c=>{
        const key=selKey(c);const on=S.metaSel.has(key);
        const row=EL('div','rowline');row.style.cursor='pointer';row.style.gap='10px';
        if(on){row.style.background='var(--goldsoft)';row.style.borderRadius='8px';row.style.padding='8px 10px';}
        const cb=document.createElement('input');cb.type='checkbox';cb.checked=on;cb.style.cssText='width:17px;height:17px;flex:0 0 auto;accent-color:var(--gold)';
        const left=EL('div');left.style.cssText='flex:1 1 auto;min-width:0';
        const l1=EL('div');l1.style.cssText='font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px';
        l1.appendChild(Object.assign(EL('span'),{textContent:c.nome,style:'overflow:hidden;text-overflow:ellipsis;white-space:nowrap'}));
        const si=stInfo(c.status);if(si){const bb=EL('span');bb.textContent=si.t;bb.style.cssText='flex:0 0 auto;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#fff;background:'+si.bg+';padding:2px 7px;border-radius:999px';l1.appendChild(bb);}
        left.appendChild(l1);
        left.appendChild(Object.assign(EL('div','muted'),{textContent:'alcance '+nMil(c.alcance)+' · '+nMil((c.conversas||0)+(c.leads||0))+' conversas · '+nMil(c.cliques)+' cliques',style:'font-size:12px'}));
        const val=Object.assign(EL('b','serif'),{textContent:fmt(c.gasto),style:'white-space:nowrap'});
        const toggle=()=>{if(S.metaSel.has(key))S.metaSel.delete(key);else S.metaSel.add(key);drawList();paint()};
        cb.onclick=ev=>{ev.stopPropagation();toggle()};
        row.onclick=toggle;
        row.appendChild(cb);row.appendChild(left);row.appendChild(val);
        pan.appendChild(row);
      });
    };
    box.appendChild(summary); box.appendChild(pan);
    box.appendChild(Object.assign(EL('p','hint'),{style:'margin-top:8px',textContent:'Marque as '+titNiv+'s que quer somar lá em cima (nenhuma marcada = todas). O selo mostra ativa ou pausada. Dados ao vivo da conta da Alke.'}));
    paint(); drawList();
  })();
  return w;
}

function viewClientes(){

function loginModal(p,mode){
  const m=EL('div','modal'); m.appendChild(EL('h3',null,(mode==='create'?'Criar login — ':'Resetar senha — ')+p.nome));
  const email=inp('email','','e-mail da profissional'); const pw=inp('password','','senha (mín. 6)');
  if(mode==='create') m.appendChild(field('E-mail dela',email));
  m.appendChild(field(mode==='create'?'Senha de acesso':'Nova senha',pw));
  const msg=EL('div','muted');msg.style.fontSize='13px';m.appendChild(msg);
  const act=EL('div','mactions');
  const cancel=EL('button','btn ghost','Cancelar');cancel.onclick=()=>ov.remove();
  const save=EL('button','btn','Salvar');
  save.onclick=async()=>{
    if(pw.value.length<6){msg.textContent='A senha precisa de 6+ caracteres.';msg.style.color='var(--alert)';return;}
    if(mode==='create' && !email.value.includes('@')){msg.textContent='E-mail inválido.';msg.style.color='var(--alert)';return;}
    save.textContent='Salvando…';
    const body=mode==='create'?{action:'create',email:email.value.trim(),password:pw.value,profissional_id:p.id}:{action:'setpassword',user_id:p.user_id,password:pw.value};
    const {data,error}=await sb.functions.invoke('admin-users',{body});
    const err=(data&&data.error)||(error&&error.message);
    if(err){msg.textContent='Erro: '+err;msg.style.color='var(--alert)';save.textContent='Salvar';return;}
    msg.textContent=mode==='create'?'Login criado ✓':'Senha trocada ✓';msg.style.color='var(--win)';
    await loadAll(); setTimeout(()=>{ov.remove();render()},1000);
  };
  act.appendChild(cancel);act.appendChild(save);m.appendChild(act);
  const ov=overlay(m); (mode==='create'?email:pw).focus();
}
function minhaConta(){
  const m=EL('div','modal'); m.appendChild(EL('h3',null,'Minha conta'));
  m.appendChild(EL('p','muted','Trocar a sua senha de acesso.'));
  const p1=inp('password','','nova senha (mín. 6)'); const p2=inp('password','','repetir senha');
  m.appendChild(field('Nova senha',p1)); m.appendChild(field('Repetir',p2));
  const msg=EL('div','muted');msg.style.fontSize='13px';m.appendChild(msg);
  const act=EL('div','mactions');
  const cancel=EL('button','btn ghost','Fechar');cancel.onclick=()=>ov.remove();
  const save=EL('button','btn','Salvar senha');
  save.onclick=async()=>{
    if(p1.value.length<6){msg.textContent='Mínimo 6 caracteres.';msg.style.color='var(--alert)';return;}
    if(p1.value!==p2.value){msg.textContent='As senhas não batem.';msg.style.color='var(--alert)';return;}
    save.textContent='Salvando…';
    const {error}=await sb.auth.updateUser({password:p1.value});
    if(error){msg.textContent='Erro: '+error.message;msg.style.color='var(--alert)';save.textContent='Salvar senha';return;}
    msg.textContent='Senha alterada ✓';msg.style.color='var(--win)';setTimeout(()=>ov.remove(),1200);
  };
  act.appendChild(cancel);act.appendChild(save);m.appendChild(act);
  const ov=overlay(m); p1.focus();
}

// ---------- helpers UI ----------
function inp(type,val,ph){const i=document.createElement('input');i.type=type;if(val!=null)i.value=val;if(ph)i.placeholder=ph;return i}
function sel(opts,val,ph){const s=document.createElement('select');if(ph)s.appendChild(new Option(ph,''));opts.forEach(([v,l])=>s.appendChild(new Option(l,v)));if(val!=null)s.value=val;return s}
function field(label,node){const f=EL('div','f');f.appendChild(EL('label',null,label));f.appendChild(node);return f}
function overlay(node){const ov=EL('div','ov');ov.onclick=e=>{if(e.target===ov)ov.remove()};ov.appendChild(node);document.body.appendChild(ov);return ov}

boot();
</script>
