<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alke Beauty Studio</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#A8823A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Alke Studio">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
// auto-atualiza quando reabrir o app: compara o ETag do index.html e recarrega se mudou
(function(){var u=location.pathname,tag=null;
 function get(cb){fetch(u,{cache:'no-store',method:'HEAD'}).then(function(r){cb(r.headers.get('etag')||r.headers.get('last-modified'))}).catch(function(){cb(null)})}
 get(function(t){tag=t});
 document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&tag){ get(function(t){ if(t&&t!==tag){ location.reload(); } }); } });
})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFE4CE; --bg2:#E8DBC0; --surface:#FAF4E6; --surface2:#F4EAD4;
  --ink:#332C23; --muted:#8C7E65; --gold:#A8823A; --gold2:#C19A4C; --goldsoft:#EADFC4;
  --line:#E2D4B8; --line2:#D8C7A4; --wine:#7A4A52;
  --win:#5B8C5A; --warn:#C08A2E; --alert:#B5544E;
  --disp:'Outfit','Inter',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif; --brand:'Cormorant Garamond',Georgia,serif;
  --shadow:0 1px 2px rgba(51,44,35,.05),0 10px 30px rgba(51,44,35,.07);
}
@media (prefers-color-scheme:dark){:root[data-theme="__autodark_off__"]{
  --bg:#1E1913; --bg2:#19140F; --surface:#272019; --surface2:#2F271E;
  --ink:#F1E7D6; --muted:#B0A185; --gold:#C8A25A; --gold2:#D9B874; --goldsoft:#3A2F1E;
  --line:#3A3122; --line2:#473C29; --win:#7CB07A; --warn:#D9A84E; --alert:#D98B84;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1E1913; --bg2:#19140F; --surface:#272019; --surface2:#2F271E;
  --ink:#F1E7D6; --muted:#B0A185; --gold:#C8A25A; --gold2:#D9B874; --goldsoft:#3A2F1E;
  --line:#3A3122; --line2:#473C29; --win:#7CB07A; --warn:#D9A84E; --alert:#D98B84;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1100px 640px at 50% -240px, var(--surface), var(--bg) 62%) fixed;color:var(--ink);font-family:var(--body);font-size:14px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--disp);font-weight:600;margin:0;letter-spacing:.2px}
button,input,select,textarea{font-family:var(--body);font-size:14px}
/* iOS: campo com fonte <16px faz zoom automático ao focar. No celular, força 16px em tudo. */
@media(max-width:820px){input,select,textarea{font-size:16px!important}}
button{cursor:pointer}
.gold{color:var(--gold)}
.serif{font-family:var(--disp)}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
.muted{color:var(--muted)}
/* ====== LOGIN ====== */
#login{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% -10%,var(--surface),var(--bg) 60%)}
.loginbox{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:36px 30px;text-align:center}
.wordmark{font-family:var(--brand);font-size:38px;letter-spacing:.32em;color:var(--gold);font-weight:600;padding-left:.32em}
.wordmark small{display:block;font-size:11px;letter-spacing:.42em;color:var(--muted);margin-top:4px;padding-left:.42em;font-family:var(--body);font-weight:500}
.arc{width:70px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px auto 22px}
#login input{width:100%;padding:13px 14px;border:1px solid var(--line2);border-radius:11px;background:var(--bg);color:var(--ink);margin-bottom:11px}
#login input:focus{outline:2px solid var(--gold);outline-offset:1px}
button{font-family:inherit}
.btn{border:1px solid var(--gold);background:var(--gold);color:#fff;border-radius:11px;padding:12px 18px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;min-height:44px;line-height:1.1;box-shadow:0 1px 2px rgba(40,28,20,.12);transition:transform .08s ease,filter .15s ease,background .15s ease}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface);color:var(--gold);border-color:var(--line2);box-shadow:none}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:9px;min-height:0}
@media(max-width:720px){.btn.sm{min-height:38px}}
.loginmsg{min-height:18px;font-size:13px;color:var(--alert);margin-top:8px}
/* ====== APP SHELL ====== */
#app{display:none;min-height:100%}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--bg2);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .mark{font-family:var(--brand);font-size:24px;letter-spacing:.28em;color:var(--gold);font-weight:600;padding:6px 10px 2px .28em}
.side .mark small{display:block;font-family:var(--body);font-size:9px;letter-spacing:.38em;color:var(--muted);font-weight:500;padding-left:.1em}
.navsep{height:1px;background:var(--line);margin:12px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--ink);border:none;background:none;width:100%;text-align:left;font-weight:500;font-size:14px}
.nav .ic{width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;opacity:.85;flex:0 0 auto}
.nav .ic svg{width:19px;height:19px}
.nav:hover{background:var(--surface2)}
.nav.on{background:var(--surface);box-shadow:var(--shadow);color:var(--gold);font-weight:600}
.side .who{margin-top:auto;padding:12px 10px;border-top:1px solid var(--line);font-size:13px}
.side .who b{display:block}
.content{min-width:0;padding:22px clamp(16px,3vw,34px);padding-left:max(16px,env(safe-area-inset-left))}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.topbar h2{font-size:30px}
.topbar .sub{color:var(--muted);font-size:13px}
.spacer{margin-left:auto}
/* mobile top nav */
.mtop{display:none}
.drawov{display:none}
/* ====== FUNIL ====== */
.kstats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.kstat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.kstat b{font-family:var(--disp);font-size:18px}
.kstat .d{width:8px;height:8px;border-radius:50%}
.board{display:flex;gap:13px;overflow-x:auto;padding:14px 2px 10px}
.col{flex:0 0 275px;min-width:275px;background:var(--surface2);border:1px solid var(--line);border-radius:15px;display:flex;flex-direction:column}
.col.drop{outline:2px dashed var(--gold);outline-offset:-4px;background:var(--goldsoft)}
.card[draggable]{cursor:grab}.card[draggable]:active{cursor:grabbing}
.colh{display:flex;align-items:center;justify-content:space-between;padding:13px 14px 7px}
.colh b{font-family:var(--disp);font-size:16px;font-weight:600}
.pill{font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--muted);font-variant-numeric:tabular-nums}
.cards{display:flex;flex-direction:column;gap:9px;padding:3px 10px 13px;min-height:30px}
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow);cursor:pointer;transition:transform .08s,box-shadow .12s}
.card:active{transform:scale(.99)}
.card:hover{box-shadow:0 6px 18px rgba(40,28,20,.12)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.statcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px}
.statcard .lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.statcard .val{font-size:24px;font-weight:800;margin:4px 0 2px;letter-spacing:-.01em;line-height:1}
.statcard .sub{font-size:11.5px;color:var(--muted)}
.statcard.accent{border-color:var(--gold2)}.statcard.accent .val{color:var(--gold)}
.achips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.achip{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;font-family:inherit;color:var(--ink);transition:transform .1s,filter .12s}
.achip:active{transform:scale(.95)} .achip:hover{filter:brightness(.98)}
.achip svg{width:16px;height:16px;flex:0 0 auto}
.achip .ct{font-weight:800}
.achip.red{border-color:color-mix(in srgb,var(--alert) 45%,var(--line2));color:var(--alert);background:color-mix(in srgb,var(--alert) 9%,var(--surface))}
.achip.yel{border-color:color-mix(in srgb,var(--warn) 45%,var(--line2));color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.achip.gold{border-color:color-mix(in srgb,var(--gold) 40%,var(--line2));color:var(--gold);background:color-mix(in srgb,var(--gold) 8%,var(--surface))}
.achip.on{outline:2px solid currentColor;outline-offset:1px;filter:brightness(.97)}
.achip.flat{color:var(--muted);background:var(--surface2);border-color:var(--line)}
.cardtabs{display:flex;gap:3px;background:var(--surface2);border-radius:11px;padding:4px;margin:4px 0 14px}
.cardtab{flex:1;padding:9px 6px;border:0;background:none;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;font-family:inherit;transition:.12s}
.cardtab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(40,28,20,.1)}
.inforow{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.inforow .k{color:var(--muted)}.inforow .v{font-weight:600;text-align:right}
.tl{position:relative;padding-left:20px;margin:2px 0}
.tl::before{content:"";position:absolute;left:4px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.tl::after{content:"";position:absolute;left:7.5px;top:14px;bottom:-10px;width:1.5px;background:var(--line)}
.tl:last-child::after{display:none}
.tl .tt{font-weight:600;font-size:14px}.tl .td{font-size:12px;color:var(--muted)}
.iconbtn:active{transform:scale(.9)}
.warow{transition:background .12s} .warow:active{background:var(--surface2)}
.card:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(51,44,35,.07),0 14px 32px rgba(51,44,35,.1)}
.card .nm{font-weight:600;font-size:14.5px}
.card .mini{font-size:12px;color:var(--muted);margin-top:3px}
.card .svline{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink);margin-top:4px}
.card .svline .svic{width:13px;flex:0 0 auto;font-weight:700;text-align:center}
.card .svline .svtx{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .svline .svdt{flex:0 0 auto;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.card .svline .svval{margin-left:auto;color:var(--win);font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto}
.svrow{padding:11px 0;border-bottom:1px solid var(--line)}.svrow:last-child{border-bottom:0}
.bdaycols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.bdaycol{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 12px;min-width:0}
.bdaycol .eyebrow{display:block;margin-bottom:4px}
.bdayrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.bdaycol .bdayrow:last-child{border-bottom:0}
.bdayrow.today{background:var(--goldsoft);border-radius:8px;padding:7px 9px;border-bottom:0;margin:3px 0}
.bdaybanner{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:12px;background:var(--goldsoft);margin-bottom:12px}
@media(max-width:640px){.bdaycols{grid-template-columns:1fr}}
.walayout{display:flex;margin-top:12px;border:1px solid var(--line);border-radius:14px;overflow:hidden;height:min(66vh,600px);background:var(--surface)}
.walist{width:330px;flex:0 0 330px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.walist .walsearch{padding:10px;border-bottom:1px solid var(--line)}
.walist .walrows{flex:1 1 auto;min-height:0;overflow:auto}
.warow{display:flex;gap:10px;align-items:center;padding:11px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.warow:hover{background:var(--bg)} .warow.on{background:var(--goldsoft)}
.wachat{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;min-height:0}
.wachat .wahead{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.wachat .wabody{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column;gap:7px;padding:12px;background:var(--bg)}
body.scroll-locked{overflow:hidden}
/* barra de navegação inferior (estilo app, só no celular) */
.botnav{display:none}
@media(max-width:720px){
  .botnav{position:fixed;left:0;right:0;bottom:0;z-index:55;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -2px 14px rgba(40,28,20,.07)}
  .botnav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;color:var(--muted);font-size:10px;font-weight:600;cursor:pointer;position:relative;font-family:var(--body)}
  .botnav button.on{color:var(--gold)}
  .botnav button:active{opacity:.5}
  .botnav button.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
  .botnav button svg{width:23px;height:23px;display:block}
  .botnav .dot{position:absolute;top:5px;left:calc(50% + 6px);width:8px;height:8px;border-radius:50%;background:var(--win);border:1.5px solid var(--surface)}
  .content{padding-bottom:72px!important}
  .mtop{position:sticky;top:0;z-index:40}
}
/* player de áudio estilo WhatsApp */
.aud{display:flex;align-items:center;gap:11px;min-width:214px;max-width:252px;padding:2px 2px 2px 0}
.aud .pp{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--gold),color-mix(in srgb,var(--gold) 68%,#000));color:#fff;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;font-size:15px;box-shadow:0 2px 7px rgba(0,0,0,.2);transition:transform .08s}
.aud .pp:active{transform:scale(.93)}
.aud .wv{flex:1 1 auto;display:flex;align-items:center;gap:2.5px;height:30px}
.aud .wv i{flex:1;background:var(--line2);border-radius:999px;min-width:2.5px;transition:background .12s}
.aud .wv i.on{background:var(--gold)}
.aud .tm{font-size:11px;color:var(--muted);flex:0 0 auto;min-width:32px;text-align:right;font-variant-numeric:tabular-nums}
/* barra de gravação de áudio */
.recbar{display:flex;align-items:center;gap:10px;flex:1;padding:6px 4px}
.recbar .rdot{width:11px;height:11px;border-radius:50%;background:var(--alert);animation:recpulse 1s infinite}
@keyframes recpulse{0%,100%{opacity:1}50%{opacity:.25}}
/* botões de ícone (estilo shadcn: neutro, limpo) */
.iconbtn{background:none;border:0;width:40px;height:40px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;flex:0 0 auto;transition:background .12s,color .12s}
.iconbtn:hover{background:var(--surface2);color:var(--ink)}
.iconbtn svg{width:21px;height:21px}
.iconbtn.primary{background:var(--gold);color:#fff}.iconbtn.primary:hover{background:var(--gold);filter:brightness(.95)}
.iconbtn.rec{background:var(--alert);color:#fff}
.wachat .wafoot{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
.waback{display:none}
@media(max-width:720px){
  /* lista em tela cheia, sem cara de caixinha */
  .walayout{height:calc(100vh - 150px);min-height:420px;margin-top:8px;border-radius:12px}
  .walist{width:100%;flex:1 1 auto;border-right:0}
  .wachat{display:none}
  .waback{display:inline-flex}
  .walayout.showchat .walist{display:none}
  .walayout.showchat .wachat{display:flex}
  /* ao abrir a conversa: TELA CHEIA, igual WhatsApp do celular */
  .walayout.showchat{position:fixed;inset:0;height:100%;width:100%;margin:0;border:0;border-radius:0;z-index:60}
  .walayout.showchat .wahead{position:sticky;top:0;z-index:2;background:var(--surface);padding-top:calc(11px + env(safe-area-inset-top,0px))}
  .walayout.showchat .wafoot{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .walayout.showchat .wachat,.walayout.showchat .wabody{min-height:0}
}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.tag.org{background:var(--goldsoft);color:var(--gold)}
.tag.al{background:color-mix(in srgb,var(--alert) 15%,transparent);color:var(--alert)}
.tag.wn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tag.money{background:color-mix(in srgb,var(--win) 15%,transparent);color:var(--win);font-variant-numeric:tabular-nums}
.qa{display:flex;gap:6px;margin-top:9px}
.qb{flex:1;border:1px solid var(--line2);background:var(--bg);border-radius:8px;padding:6px;font-size:12px;font-weight:600;color:var(--muted)}
.qb.go{color:var(--gold);border-color:var(--gold)} .qb.ok{color:var(--win)} .qb.no{color:var(--muted)}
/* ====== CARDS/TILES ====== */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:13px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow)}
.tile .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--disp);font-size:30px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums}
.tile .v.pos{color:var(--win)} .tile .v.neg{color:var(--alert)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow);margin-top:16px}
.panel h3{font-size:18px;margin-bottom:3px}
.panel.caixa{background:linear-gradient(160deg,var(--goldsoft),var(--surface))}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.rowline:last-child{border-bottom:none}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.listhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.srow{display:grid;grid-template-columns:1.6fr .9fr .6fr .7fr .7fr auto;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.srow .nm{font-weight:600}
.srow input{padding:6px 8px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.soon{text-align:center;color:var(--muted);padding:50px 18px}
.soon .big{font-family:var(--disp);font-size:26px;color:var(--ink);margin-bottom:6px}
.agwrap{margin-top:14px;display:flex;overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.agcol{min-width:148px;flex:1;border-right:1px solid var(--line)}
.agcol.agtime{flex:0 0 48px;min-width:48px}
.agcol.wk{min-width:92px}
.rangebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.rangebar input{padding:8px 9px;border:1px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--ink);font-size:13px}
.rangebar .qk{border:1px solid var(--line2);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.rangebar .qk.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.segtog{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.segtog button{border:none;padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer;background:transparent;color:var(--muted)}
.segtog button.on{background:var(--gold);color:#fff}
.agcol:last-child{border-right:none}
.agh{background:var(--surface2);border-bottom:1px solid var(--line);padding:8px 6px;text-align:center;font-weight:600;font-size:12.5px;height:38px;white-space:nowrap;overflow:hidden}
.agbody{position:relative}
.aghour{height:54px;border-bottom:1px dashed var(--line)}
.agtime .aglabel{height:54px;font-size:10.5px;color:var(--muted);text-align:right;padding:2px 5px;box-sizing:border-box}
.agblk{position:absolute;left:3px;right:3px;border-radius:8px;padding:3px 7px;font-size:11.5px;line-height:1.25;overflow:hidden;cursor:pointer;color:var(--ink);border-left:3px solid var(--gold)}
.agblk b{display:block;font-size:12px;font-weight:600}
/* ====== MODAL ====== */
.ov{position:fixed;inset:0;background:rgba(40,28,20,.5);display:grid;place-items:center;padding:16px;z-index:70;animation:ovin .16s ease;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
@keyframes ovin{from{opacity:0}to{opacity:1}}
.ov .modal{animation:modin .24s cubic-bezier(.2,.8,.2,1)}
@keyframes modin{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:100%;max-width:460px;max-height:92vh;overflow:auto;padding:22px}
.modal h3{font-size:21px;margin-bottom:4px}
.modal.big{max-width:600px}
.stagepills{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.sp{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--bg);color:var(--muted);cursor:pointer}
.sp.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.f{display:flex;flex-direction:column;gap:5px;margin:12px 0}
.f label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;padding:10px 11px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);color:var(--ink)}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mactions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
a.lk{color:var(--gold);text-decoration:none;font-size:12.5px}
.chiprow{display:flex;gap:7px;flex-wrap:wrap}
. chip{}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;height:100vh;width:252px;z-index:60;transform:translateX(-105%);transition:transform .22s ease;box-shadow:0 0 50px rgba(40,28,20,.3);overflow-y:auto;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .side.open{transform:translateX(0)}
  .drawov{display:none;position:fixed;inset:0;background:rgba(40,28,20,.45);z-index:55}
  .drawov.on{display:block}
  .mtop{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .mtop .burger{background:none;border:none;color:var(--gold);cursor:pointer;line-height:0;padding:4px;display:inline-flex}
.burger svg{width:23px;height:23px}
  .mtop .mlogo{font-family:var(--brand);font-size:23px;letter-spacing:.3em;color:var(--gold);font-weight:600;padding-left:.3em}
  .topbar h2{font-size:25px}
  .two{grid-template-columns:1fr}
  .srow{grid-template-columns:1fr 1fr;gap:6px}
}
</style>

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){document.getElementById('login').style.display='grid';document.getElementById('app').style.display='none';return;}

// TEMPO REAL GLOBAL: qualquer mudança no banco (lead novo, cadastro preenchido, agendamento, serviço…) atualiza a tela sozinha
let _rtChan=null, _rtT=null;
function setupGlobalRealtime(){
  if(_rtChan){ try{sb.removeChannel(_rtChan);}catch(_){} _rtChan=null; }
  const reload=()=>{ clearTimeout(_rtT); _rtT=setTimeout(async()=>{
    await loadAll();
    // não re-renderiza por cima de um modal aberto (form) nem da conversa aberta (tem tempo real próprio)
    const busy = document.querySelector('.ov') || (S.tab==='conversas' && S.convSel);
    if(!busy){ try{ render(); renderShell(); }catch(_){} }
  }, 600); };
  try{
    _rtChan=sb.channel('alke-global-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'leads'},reload)
      .on('postgres_changes',{event:'*',schema:'public',table:'agendamentos'},reload)
      .on('postgres_changes',{event:'*',schema:'public',table:'conversas'},reload)
      .on('postgres_changes',{event:'*',schema:'public',table:'servicos'},reload)
      .on('postgres_changes',{event:'*',schema:'public',table:'despesas'},reload)
      .subscribe();
  }catch(_){}
}
// ATUALIZAÇÃO GERAL: ao abrir/voltar pro app ou quando a internet volta, puxa tudo de novo
// (cobre o tempo em que o app ficou fechado ou a net caiu; enquanto aberto, o tempo real acima cuida)
let _resyncT=null;
async function resyncTudo(){
  try{ const {data:{session}}=await sb.auth.getSession(); if(!session)return; }catch(_){ return; }
  setupGlobalRealtime();                 // reconecta os canais de tempo real (podem ter morrido na queda)
  await loadAll();                        // puxa card, funil, conversas, financeiro… tudo fresco
  try{ if(typeof window._alkeThreadReload==='function') await window._alkeThreadReload(); }catch(_){} // conversa aberta recarrega
  const busy = document.querySelector('.ov') || (S.tab==='conversas' && S.convSel);
  if(!busy){ try{ render(); renderShell(); }catch(_){} }
  else { try{ renderShell(); }catch(_){} } // ao menos os contadores/avisos no topo
}
function agendarResync(){ clearTimeout(_resyncT); _resyncT=setTimeout(resyncTudo,250); }
try{
  window.addEventListener('online', agendarResync);                               // internet voltou
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') agendarResync(); }); // voltou pro app
  window.addEventListener('focus', agendarResync);                                // reforço (foco na aba/janela)
}catch(_){}
async function loadAll(){
  const [pros,serv,prec,leads,fin,cfg,desp,ags,cvs]=await Promise.all([
    sb.from('profissionais').select('*').order('ordem'),
    sb.from('servicos').select('*').order('nome'),
    sb.from('servicos_preco').select('*'),
    sb.from('leads').select('*').order('criado_em',{ascending:false}),
    sb.from('financeiro').select('*'),
    sb.from('studio_config').select('*').eq('id',1).maybeSingle(),
    sb.from('despesas').select('*'),
    sb.from('agendamentos').select('*'),
    sb.from('conversas').select('*').order('ultima_em',{ascending:false,nullsFirst:false}),
  ]);
  S.pros=pros.data||[]; S.servicos=serv.data||[];
  S.precos={}; (prec.data||[]).forEach(p=>S.precos[p.servico_id]=p);
  S.leads=leads.data||[];
  S.fin={}; (fin.data||[]).forEach(f=>S.fin[f.lead_id]=f);

const permOf=(p,key)=>{const pm=(p&&p.permissoes)||{}; if(key==='funil')return pm.funil!==false; return !!pm[key];};

function diasSemResposta(l){ const k=(l.telefone||'').replace(/\D/g,''); const c=k&&(S.conversas||[]).find(x=>(x.telefone||'').replace(/\D/g,'')===k); const base=c&&c.ultima_em?new Date(c.ultima_em):(l.atualizado_em?new Date(l.atualizado_em):null); if(!base)return -1; return Math.floor((Date.now()-base.getTime())/864e5); }
function diasDesdeVisita(l){ return l.realizado_em?Math.floor((Date.now()-new Date(l.realizado_em))/864e5):-1; }
// cliente que fez procedimento, sem retorno marcado: amarelo 10-19 dias, vermelho 20+ dias sem ir ao estúdio
function atencaoBucket(l){ if(l.etapa==='realizou' && !l.retorno && l.realizado_em){ const d=diasDesdeVisita(l); if(d>=20)return 'vermelho'; if(d>=10)return 'amarelo'; } return null; }
// marco de dias sem ir ao estúdio: 10,15,20,25,30 (0 = sem alerta)
function marcoSemIr(l){ if(l.etapa==='realizou' && !l.retorno && l.realizado_em){ const d=diasDesdeVisita(l); if(d>=30)return 30; if(d>=25)return 25; if(d>=20)return 20; if(d>=15)return 15; if(d>=10)return 10; } return 0; }
function leadAlert(l){
  if(l.etapa==='retorno' && l.retorno){const dd=Math.ceil((new Date(l.retorno+'T00:00:00')-new Date())/864e5); if(dd<=0)return{cls:'al',txt:'retorno atrasado'}; if(dd<=7)return{cls:'wn',txt:'retorno em '+dd+'d'};}
  if(l.etapa==='realizou' && !l.retorno && l.realizado_em){const dias=Math.floor((new Date()-new Date(l.realizado_em))/864e5); if(dias>=20)return{cls:'al',txt:dias+' dias sem ir'}; if(dias>=10)return{cls:'wn',txt:dias+' dias sem ir'};}

}

async function move(l,etapa){
  const upd={etapa,atualizado_em:new Date().toISOString()};
  if(etapa==='realizou'&&!l.realizado_em) upd.realizado_em=new Date().toISOString();
  await sb.from('leads').update(upd).eq('id',l.id);
  await loadAll(); render();
}
// recalcula a etapa do card a partir dos serviços:
// tem serviço pendente -> Agendada; todos realizados -> Realizou; sobrou falta -> Não veio
async function recomputeEtapa(leadId){
  const l=S.leads.find(x=>x.id===leadId); if(!l) return;
  const servs=servicosDoLead(leadId);
  if(!servs.length) return; // sem serviço: mantém etapa manual (lead/conversa/followup)
  const pend=servs.filter(a=>a.status==='marcado').length;
  const real=servs.filter(a=>a.status==='realizado').length;
  let etapa = pend>0 ? 'agendada' : (real===servs.length ? 'realizou' : 'naoveio');
  // realizou + data de retorno marcada -> vai pra coluna Retorno
  if(etapa==='realizou' && l.retorno) etapa='retorno';
  if(l.etapa===etapa) return;
  const upd={etapa,atualizado_em:new Date().toISOString()};
  if((etapa==='realizou'||etapa==='retorno')&&!l.realizado_em) upd.realizado_em=new Date().toISOString();
  await sb.from('leads').update(upd).eq('id',leadId);
}
// desmarca (cancela) um serviço: sai da agenda e a cliente volta pra Em conversa
async function desmarcarServico(agId,leadId){
  if(!confirm('Desmarcar esse serviço? O horário sai da agenda e a cliente volta pra "Em conversa".'))return;
  const a=S.agendamentos.find(x=>x.id===agId);
  try{if(a&&a.google_event_id)await sb.functions.invoke('agenda-sync',{body:{action:'delete',event_id:a.google_event_id}});}catch(_){}
  await sb.from('agendamentos').update({status:'cancelado',google_event_id:null}).eq('id',agId);
  await loadAll();
  const rest=servicosDoLead(leadId);
  if(!rest.some(x=>x.status==='marcado'||x.status==='realizado')){ await sb.from('leads').update({etapa:'conversa',atualizado_em:new Date().toISOString()}).eq('id',leadId); }
  else { await recomputeEtapa(leadId); }
  await loadAll();
  document.querySelectorAll('.ov').forEach(o=>o.remove());
  render();
  if(leadId) openLead(leadId);
}
// marca UM serviço (agendamento) como realizado/faltou, de dentro do card
async function marcarServico(agId,status,leadId){
  await sb.from('agendamentos').update({status,realizado_em:status==='realizado'?new Date().toISOString():null}).eq('id',agId);
  await loadAll();
  if(leadId){ await recomputeEtapa(leadId); await loadAll(); }
  document.querySelectorAll('.ov').forEach(o=>o.remove());
  render();
  if(leadId) openLead(leadId);
}

  const l=S.leads.find(x=>x.id===id)||{};
  const hh=EL('div','listhead');hh.appendChild(EL('div','eyebrow','Serviços da cliente'));
  const addS=EL('button','btn ghost sm','+ Serviço');
  addS.onclick=()=>{closer();openAgendamento(null,{lead_id:id,cliente_nome:l.nome,cliente_telefone:l.telefone})};
  hh.appendChild(addS); sp.appendChild(hh);
  const servs=servicosDoLead(id);
  if(!servs.length) sp.appendChild(Object.assign(EL('p','muted'),{style:'margin-top:6px',textContent:'Nenhum servico ainda. Toque em "+ Servico".'}));
  else servs.forEach(a=>{
    const sv=servById(a.servico_id),pro=proById(a.profissional_id);
    const row=EL('div','svrow');
    const topr=EL('div','row spread'); const infoc=EL('div');
    infoc.appendChild(Object.assign(EL('div'),{textContent:sv.nome||'servico',style:'font-weight:600'}));
    const metaTxt=[pro.nome, a.inicio?(new Date(a.inicio).toLocaleDateString('pt-BR')+' '+hhmm(new Date(a.inicio))):'', (canMoney(a.profissional_id)&&valorMostra(a)!=null)?fmt(valorMostra(a)):''].filter(Boolean).join(' · ');
    infoc.appendChild(Object.assign(EL('div','muted'),{textContent:metaTxt,style:'font-size:12.5px'}));
    topr.appendChild(infoc);
    const stt=EL('span','tag '+(a.status==='realizado'?'money':a.status==='faltou'?'al':'org'),statusLabel(a.status)); topr.appendChild(stt); row.appendChild(topr);
    const btns=EL('div','qa'); btns.style.marginTop='9px';
    if(a.status==='marcado'){
      const ok=EL('button','qb ok','✓ Realizou');ok.onclick=()=>marcarServico(a.id,'realizado',id);
      const no=EL('button','qb no','✕ Faltou');no.onclick=()=>marcarServico(a.id,'faltou',id);
      const dm=EL('button','qb','⊘ Desmarcar');dm.onclick=()=>desmarcarServico(a.id,id);
      const ed=EL('button','qb','Editar');ed.onclick=()=>{closer();openAgendamento(a,{})};
      btns.appendChild(ok);btns.appendChild(no);btns.appendChild(dm);btns.appendChild(ed);
    } else {
      const undo=EL('button','qb','↩ Desfazer');undo.onclick=()=>marcarServico(a.id,'marcado',id);
      const ed=EL('button','qb','Editar');ed.onclick=()=>{closer();openAgendamento(a,{})};
      btns.appendChild(undo);btns.appendChild(ed);
    }
    row.appendChild(btns); sp.appendChild(row);
  });
  return sp;
}
// card do funil: so acao (etapa + servicos). Edicao de dados e na aba Clientes.
function openLead(id){

  const telK=(l.telefone||'').replace(/\D/g,'');

  // cabeçalho: avatar + nome + telefone + fechar
  const head=EL('div');head.style.cssText='display:flex;align-items:center;gap:12px;margin-bottom:14px';
  head.appendChild(avatarEl(convo,46,true));
  const hi=EL('div');hi.style.cssText='flex:1;min-width:0';

  m.appendChild(head);

  if(telK){const ac=EL('button','btn ghost','Abrir conversa');ac.style.flex='1';ac.onclick=()=>{ov.remove();S.convSel=l.telefone;S.tab='conversas';renderShell();render();};topact.appendChild(ac);}

  const etBtn=EL('button','btn ghost');etBtn.style.cssText='width:100%;display:flex;justify-content:space-between;align-items:center';
  etBtn.innerHTML='<span class="muted" style="font-weight:600">Etapa</span><span style="font-weight:700">'+curEt.l+' ▾</span>';
  etBtn.onclick=()=>{ const menu=EL('div');menu.style.cssText='position:absolute;left:0;right:0;top:48px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);z-index:5;overflow:hidden;max-height:50vh;overflow-y:auto';
    ETAPAS.forEach(e=>{const r=EL('div');r.style.cssText='padding:12px 16px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--line)'+(e.k===curEt.k?';background:var(--goldsoft);font-weight:700':'');r.textContent=e.l;r.onclick=async()=>{await move(l,e.k);ov.remove();openLead(id);};menu.appendChild(r);});
    etRow.appendChild(menu);const cl=(ev)=>{if(!menu.contains(ev.target)&&ev.target!==etBtn){menu.remove();document.removeEventListener('click',cl);}};setTimeout(()=>document.addEventListener('click',cl),0); };
  etRow.appendChild(etBtn);m.appendChild(etRow);
  // abas
  const tb=EL('div','cardtabs'); const body=EL('div');
  const TABS=['Resumo','Atividades','Conversa']; let active='Resumo';
  const resumoView=()=>{ const d=EL('div');
    [['Telefone',l.telefone?telLabel(l.telefone):'—'],['Nascimento',l.nascimento?brDate(l.nascimento,{day:'2-digit',month:'2-digit',year:'numeric'}):'—'],['Origem',l.origem||'—'],['Instagram',l.instagram||'—'],['Entrou',l.criado_em?brDate(l.criado_em,{day:'2-digit',month:'2-digit',year:'numeric'}):'—']].forEach(([k,v])=>{const r=EL('div','inforow');r.innerHTML='<span class="k"></span><span class="v"></span>';r.querySelector('.k').textContent=k;r.querySelector('.v').textContent=v;d.appendChild(r);});
    if(l.obs){const o=EL('div');o.style.marginTop='12px';o.innerHTML='<div class="eyebrow" style="margin-bottom:4px">Observações</div>';o.appendChild(Object.assign(EL('div'),{textContent:l.obs,style:'font-size:14px'}));d.appendChild(o);}
    if(l.proxima_acao)d.appendChild(Object.assign(EL('div','muted'),{textContent:'→ '+l.proxima_acao,style:'margin-top:10px;font-size:13px'}));
    d.appendChild(servicosBloco(id,()=>ov.remove()));
    const footr=EL('div');footr.style.cssText='display:flex;gap:8px;margin-top:14px';

    const vc=EL('button','btn ghost sm','Cadastro completo');vc.onclick=()=>{ov.remove();openCliente(clienteDoLead(id))};footr.appendChild(vc);
    d.appendChild(footr); return d; };
  const atividadesView=()=>{ const d=EL('div'); const items=[];
    servicosDoLead(id).forEach(a=>{const sv=servById(a.servico_id),pro=proById(a.profissional_id);const dt=a.realizado_em||a.inicio;const st=a.status==='realizado'?'Realizou':(a.status==='faltou'?'Faltou':'Agendado');items.push({dt,tt:st+' · '+(sv.nome||'serviço'),td:[pro.nome,dt?brDate(dt,{day:'2-digit',month:'2-digit'})+' '+hhmm(new Date(dt)):''].filter(Boolean).join(' · ')});});

    items.sort((a,b)=>new Date(b.dt||0)-new Date(a.dt||0));
    if(!items.length)d.appendChild(Object.assign(EL('div','muted'),{textContent:'Sem atividades ainda.',style:'padding:16px;text-align:center'}));
    items.forEach(it=>{const t=EL('div','tl');t.innerHTML='<div class="tt"></div><div class="td"></div>';t.querySelector('.tt').textContent=it.tt;t.querySelector('.td').textContent=it.td;d.appendChild(t);}); return d; };
  const conversaView=()=>{ const d=EL('div');d.style.cssText='height:56vh;display:flex;flex-direction:column;margin:0 -6px';
    if(!telK){d.appendChild(Object.assign(EL('div','muted'),{textContent:'Sem telefone pra conversar.',style:'padding:20px;text-align:center'}));return d;}
    d.appendChild(Object.assign(EL('div','muted'),{textContent:'Carregando conversa…',style:'margin:auto'}));
    threadView(l.telefone,{closeOverlay:()=>ov.remove()}).then(el=>{el.style.height='100%';el.style.flex='1 1 0';el.style.minHeight='0';d.innerHTML='';d.appendChild(el);if(el._toBottom)el._toBottom();}); return d; };
  const views={Resumo:resumoView,Atividades:atividadesView,Conversa:conversaView};
  const paint=()=>{ tb.innerHTML=''; TABS.forEach(t=>{const b=EL('button','cardtab'+(t===active?' on':''),t);b.onclick=()=>{active=t;paint();};tb.appendChild(b);}); body.innerHTML=''; body.appendChild(views[active]()); };
  m.appendChild(tb); m.appendChild(body); paint();
  const ov=overlay(m);

// ficha de edicao de dados da cliente
function openEditarCliente(id,prefill){
  const l = id ? {...S.leads.find(x=>x.id===id)} : Object.assign({etapa:'lead',origem:'',nome:'',telefone:'',nascimento:'',email:'',instagram:'',retorno:'',obs:'',proxima_acao:''}, prefill||{});
  const m=EL('div','modal big'); m.appendChild(EL('h3',null,id?'Editar cliente':'Nova cliente'));
  const nome=inp('text',l.nome,'Nome da cliente');
  const tel=inp('text',l.telefone,'DDD + numero');
  const nasc=inp('date',l.nascimento||'');
  const email=inp('email',l.email||'','e-mail (opcional)');
  const insta=inp('text',l.instagram||'','@usuario');
  const org=sel(ORIGENS.map(o=>[o,o]),l.origem,'— origem —');
  const prox=inp('text',l.proxima_acao,'Ex: responder no WhatsApp');
  const ret=inp('date',l.retorno||'');
  const obs=document.createElement('textarea');obs.rows=2;obs.value=l.obs||'';obs.placeholder='Preferencias, alergias, historico…';
  m.appendChild(field('Nome',nome)); m.appendChild(field('WhatsApp',tel));
  const two0=EL('div','two'); two0.appendChild(field('Data de nascimento',nasc)); two0.appendChild(field('E-mail',email)); m.appendChild(two0);
  const two1=EL('div','two'); two1.appendChild(field('Instagram',insta)); two1.appendChild(field('Origem',org)); m.appendChild(two1);
  m.appendChild(field('Proxima acao',prox));
  m.appendChild(field('Data de retorno',ret));
  m.appendChild(field('Observacoes',obs));
  const act=EL('div','mactions');
  if(id&&isAdmin()){const del=EL('button','btn ghost sm','Excluir cliente');del.style.color='var(--alert)';del.onclick=async()=>{
    if(!confirm('Excluir a cliente '+(nome.value||'')+' e todos os agendamentos dela? Nao da pra desfazer.'))return;
    const servs=servicosDoLead(id);
    for(const a of servs){try{if(a.google_event_id)await sb.functions.invoke('agenda-sync',{body:{action:'delete',event_id:a.google_event_id}});}catch(_){}}
    await sb.from('agendamentos').delete().eq('lead_id',id);
    await sb.from('leads').delete().eq('id',id);
    ov.remove();await loadAll();render();
  };del.style.marginRight='auto';act.appendChild(del);}
  const cancel=EL('button','btn ghost','Cancelar');cancel.onclick=()=>ov.remove();
  const save=EL('button','btn','Salvar');
  save.onclick=async()=>{
    const data={nome:nome.value.trim(),telefone:tel.value.trim(),nascimento:nasc.value||null,email:email.value.trim()||null,instagram:insta.value.trim()||null,origem:org.value,
      proxima_acao:prox.value.trim()||null,retorno:ret.value||null,obs:obs.value.trim(),atualizado_em:new Date().toISOString()};
    let tid=id;
    if(id){ await sb.from('leads').update(data).eq('id',id); }
    else {
      data.etapa='lead';
      const key=(tel.value||'').replace(/\D/g,'');
      const ex = key && S.leads.find(x=>x.telefone && x.telefone.replace(/\D/g,'')===key);
      if(ex){ tid=ex.id; await sb.from('leads').update(data).eq('id',ex.id); }
      else { data.criado_em=new Date().toISOString(); const {data:ins}=await sb.from('leads').insert(data).select().single(); tid=ins&&ins.id; }
    }
    ov.remove(); await loadAll(); if(tid) await recomputeEtapa(tid); await loadAll(); render();
  };
  act.appendChild(cancel); act.appendChild(save); m.appendChild(act);
  const ov=overlay(m); nome.focus();
}

function viewServicos(){
  const w=EL('div'); const t=pageHead('Serviços');
  if(canPreco()){const add=EL('button','btn','+ Serviço');add.style.marginLeft='auto';add.onclick=()=>openServ(null);t.appendChild(add);}
  w.appendChild(t);
  w.appendChild(EL('p','muted','Admin e sócias cadastram os serviços e definem custo e preço de todas as profissionais.'));
  // agrupa por profissional
  S.pros.filter(p=>p.presta_servico!==false).forEach(pro=>{
    const list=S.servicos.filter(s=>s.profissional_id===pro.id);
    if(!list.length && !canPreco()) return;
    const pan=EL('div','panel');
    const head=EL('div','listhead'); const hn=EL('div');
    const dot=EL('span','dot');dot.style.background=pro.cor;dot.style.marginRight='8px';
    const h3=EL('h3');h3.appendChild(dot);h3.appendChild(document.createTextNode(pro.nome));hn.appendChild(h3);
    head.appendChild(hn); pan.appendChild(head);
    if(!list.length) pan.appendChild(EL('div','muted','Nenhum serviço ainda.'));
    list.forEach(s=>{
      const price=S.precos[s.id]||{};
      const canSee=canPreco();
      const row=EL('div','srow');
      row.appendChild(EL('span','nm',s.nome));
      row.appendChild(EL('span','muted',(s.tempo_min||0)+' min'));
      row.appendChild(EL('span','muted',canSee?'custo':''));
      row.appendChild(EL('span',null,canSee?fmt(price.custo):'•••'));
      row.appendChild(EL('span',null,canSee?fmt(price.preco):'•••'));
      if(canSee){const ed=EL('button','btn ghost sm','✎');ed.onclick=()=>openServ(s.id);row.appendChild(ed);}
      else row.appendChild(EL('span'));
      pan.appendChild(row);
    });
    w.appendChild(pan);
  });
  return w;
}
function openServ(id){
  if(!canPreco()) return; // só admin + sócias definem serviços/preços
  const s = id ? {...S.servicos.find(x=>x.id===id)} : {nome:'',profissional_id:S.me.id,tempo_min:30};
  const price = id ? (S.precos[id]||{custo:0,preco:0}) : {custo:0,preco:0};
  const m=EL('div','modal'); m.appendChild(EL('h3',null,id?'Serviço':'Novo serviço'));
  const nome=inp('text',s.nome);
  const proOpts=S.pros.filter(p=>p.presta_servico!==false).map(p=>[p.id,p.nome]);
  const pro=sel(proOpts, s.profissional_id); // admin e sócias escolhem a profissional
  const tempo=inp('number',s.tempo_min); const custo=inp('number',price.custo); const preco=inp('number',price.preco);
  m.appendChild(field('Nome do serviço',nome)); m.appendChild(field('Profissional',pro));
  const two=EL('div','two'); two.appendChild(field('Tempo (min)',tempo)); two.appendChild(field('Custo',custo)); m.appendChild(two);
  m.appendChild(field('Preço',preco));
  const act=EL('div','mactions');
  if(id){const del=EL('button','btn ghost sm','Excluir');del.style.marginRight='auto';del.onclick=async()=>{await sb.from('servicos').delete().eq('id',id);ov.remove();await loadAll();render()};act.appendChild(del);}
  const cancel=EL('button','btn ghost','Cancelar');cancel.onclick=()=>ov.remove();
  const save=EL('button','btn','Salvar');
  save.onclick=async()=>{
    const d={nome:nome.value.trim(),profissional_id:pro.value,tempo_min:Number(tempo.value)||0};
    let sid=id;
    if(id) await sb.from('servicos').update(d).eq('id',id);
    else{const {data:ins}=await sb.from('servicos').insert(d).select().single();sid=ins?.id;}
    if(sid) await sb.from('servicos_preco').upsert({servico_id:sid,custo:Number(custo.value)||0,preco:Number(preco.value)||0});
    ov.remove(); await loadAll(); render();
  };
  act.appendChild(cancel); act.appendChild(save); m.appendChild(act);
  const ov=overlay(m); nome.focus();
}

// ---------- PAINEL ----------
const inRange=d=>{const x=(d||'').slice(0,10);return x>=S.dashFrom && x<=S.dashTo};
function mesesNoRange(){const set=new Set();let [y,m]=S.dashFrom.slice(0,7).split('-').map(Number);const end=S.dashTo.slice(0,7);while(true){const k=y+'-'+String(m).padStart(2,'0');set.add(k);if(k>=end)break;m++;if(m>12){m=1;y++}if(set.size>60)break}return set}
function vendasMes(proId){
  return S.agendamentos.filter(a=>a.status==='realizado' && valorAt(a)!=null && inRange(a.realizado_em||a.inicio) && (!proId||a.profissional_id===proId));
}
function resumo(proId){
  const v=vendasMes(proId); const fat=v.reduce((s,a)=>s+(valorAt(a)||0),0);
  const custo=v.reduce((s,a)=>s+(custoAt(a)||0),0);
  return {fat,custo,n:v.length,ticket:v.length?fat/v.length:0};
}
function viewPainel(){
  const w=EL('div'); w.appendChild(pageHead('Dashboard', S.me.nome));
  w.appendChild(rangeBar());
  if(isAdmin()||isSocia()){
    S.dashPro = S.dashPro||null;

    const chips=EL('div','rangebar'); chips.style.marginTop='6px';
    const mk=(label,val)=>{const b=EL('button','qk'+(S.dashPro===val?' on':''),label);b.onclick=()=>{S.dashPro=val;render()};return b};
    chips.appendChild(mk('Geral',null));
    S.pros.filter(p=>p.presta_servico!==false && canMoney(p.id)).forEach(p=>chips.appendChild(mk(p.nome,p.id)));
    w.appendChild(chips);
    if(S.dashPro){
      const pro=proById(S.dashPro); const r=resumo(S.dashPro); const naoSocia=!pro.socia; const pct=pctPro(pro);

        g.appendChild(tile('Repasse ao studio ('+pct+'%)',fmt(r.fat*pct/100),'neg'));
        g.appendChild(tile('Custo material',fmt(r.custo),'neg'));
      } else {
        g.appendChild(tile('Custo material',fmt(r.custo),'neg'));
        g.appendChild(tile('Lucro (fat − custo)',fmt(r.fat-r.custo),'pos'));

      w.appendChild(g);
      w.appendChild(historicoPanel(S.dashPro,{bruto:true,pct:naoSocia?pct:0}));

    const cx=caixa();
    const g=EL('div','grid');
    g.appendChild(tile('Faturamento do studio',fmt(fatT)));
    g.appendChild(tile('Atendimentos',String(vendasMes().length)));
    g.appendChild(tile('Caixa do studio',fmt(cx.saldo),cx.saldo>=0?'pos':'neg'));
    w.appendChild(g);
    const pan=EL('div','panel'); pan.appendChild(EL('h3',null,'Por profissional'));
    pan.appendChild(Object.assign(EL('p','muted'),{style:'margin-top:-4px;font-size:12.5px',textContent:'Toque numa profissional pra ver tudo dela em detalhe.'}));
    S.pros.filter(p=>p.presta_servico!==false && canMoney(p.id)).forEach(p=>{
      const r=resumo(p.id); const row=EL('div','rowline'); row.style.cursor='pointer';
      const left=EL('div');const dot=EL('span','dot');dot.style.background=p.cor;dot.style.marginRight='8px';
      const nm=EL('span');nm.appendChild(dot);nm.appendChild(document.createTextNode(p.nome));left.appendChild(nm);
      row.appendChild(left);
      const rr=EL('div','muted');rr.innerHTML='fat. <b style="color:var(--ink)">'+fmt(r.fat)+'</b> &nbsp;·&nbsp; '+r.n+' atend.';
      row.appendChild(rr); row.onclick=()=>{S.dashPro=p.id;render()}; pan.appendChild(row);
    });
    w.appendChild(pan);
    w.appendChild(historicoPanel(null,{bruto:true}));
    w.appendChild(caixaPanel()); w.appendChild(despesasPanel());
    w.appendChild(aniversariantesPanel());
    return w;
  }
  // sócia / profissional
  const r=resumo(S.me.id);
  const g=EL('div','grid');
  if(S.me.socia){
    g.appendChild(tile('Faturamento',fmt(r.fat)));
    g.appendChild(tile('Atendimentos',String(r.n)));
    g.appendChild(tile('Ticket médio',fmt(r.ticket)));
    g.appendChild(tile('Lucro',fmt(r.fat-r.custo+caixa().saldo/2),'pos'));
    w.appendChild(g);
    w.appendChild(historicoPanel(S.me.id,{bruto:true}));
    w.appendChild(caixaPanel()); w.appendChild(despesasPanel());
  } else {

// info de aniversário a partir do nascimento (lê a string Y-M-D direto, sem fuso)
function bdayInfo(nasc){
  if(!nasc) return null;
  const m=String(nasc).slice(0,10).split('-'); if(m.length<3) return null;
  const by=+m[0], bmo=+m[1]-1, bd=+m[2]; if(isNaN(bmo)||isNaN(bd)) return null;
  const now=new Date(); now.setHours(0,0,0,0);
  const monD=new Date(mondayOf(now.toISOString().slice(0,10))+'T00:00:00');
  const sun=new Date(monD); sun.setDate(sun.getDate()+6);
  const thisY=new Date(now.getFullYear(),bmo,bd);
  const today=(bmo===now.getMonth() && bd===now.getDate());
  const thisWeek=thisY>=monD && thisY<=sun;
  const thisMonth=(bmo===now.getMonth());
  let next=new Date(now.getFullYear(),bmo,bd); if(next<now) next=new Date(now.getFullYear()+1,bmo,bd);
  const daysTo=Math.round((next-now)/864e5);
  const age=by>1900?(next.getFullYear()-by):null;
  return {dia:bd,mes:bmo,today,thisWeek,thisMonth,daysTo,age};
}

function agGridTime(){
  const tc=EL('div','agcol agtime'); tc.appendChild(EL('div','agh'));
  const tb=EL('div','agbody'); for(let h=AG0;h<AG1;h++)tb.appendChild(Object.assign(EL('div','aglabel'),{textContent:String(h).padStart(2,'0')+'h'})); tc.appendChild(tb); return tc;

function layoutCol(evs){
  evs.forEach(a=>{a._s=new Date(a.inicio).getTime();a._e=a.fim?new Date(a.fim).getTime():a._s+1800000});
  evs.sort((a,b)=>a._s-b._s||a._e-b._e);
  let i=0;
  while(i<evs.length){
    let cl=[evs[i]],maxEnd=evs[i]._e,j=i+1;
    while(j<evs.length&&evs[j]._s<maxEnd){cl.push(evs[j]);maxEnd=Math.max(maxEnd,evs[j]._e);j++}
    const lanes=[];
    cl.forEach(e=>{let k=0;while(k<lanes.length&&lanes[k]>e._s)k++;e._lane=k;lanes[k]=e._e});
    cl.forEach(e=>e._total=lanes.length); i=j;
  }
  return evs;
}

function temCadastroBasico(l){ const nomeOk=l.nome && !/^Cliente \d{4}$/.test(l.nome) && l.nome.trim().length>=2; return !!(nomeOk && l.telefone && l.nascimento); }
async function enviarLinkCadastro(leadId, inicioISO){
  const l=S.leads.find(x=>x.id===leadId); if(!l||!l.telefone) return;
  // só manda pra quem AINDA não tem cadastro básico (Nome + número + data de nascimento)
  if(l.cadastro_completo || temCadastroBasico(l)) return;
  // evita re-enviar no mesmo dia (se agendar vários serviços juntos)
  if(l.link_cadastro_em && (Date.now()-new Date(l.link_cadastro_em).getTime()) < 20*3600*1000) return;
  const tel=l.telefone.replace(/\D/g,''); if(tel.length<10) return;
  const prim=(l.nome||'').split(' ')[0]||'';
  const link='https://alkebeautystudio-hub.github.io/alke-studio/cadastro.html?tel=55'+tel.replace(/^55/,'')+(prim?('&nome='+encodeURIComponent(prim)):'');
  let quando=''; try{ if(inicioISO){ const dt=new Date(inicioISO); quando=brDate(inicioISO,{weekday:'long',day:'2-digit',month:'2-digit'})+' às '+hhmm(dt); } }catch(_){}
  const msg = quando
    ? ('Oi'+(prim?' '+prim:'')+'! 💛 Seu horário ficou marcado para '+quando+'. Pra deixar tudo certinho e garantir condições exclusivas do nosso estúdio, completa seu cadastro rapidinho aqui: '+link)
    : ('Oi'+(prim?' '+prim:'')+'! 💛 Pra deixar seu atendimento certinho e garantir condições exclusivas do nosso estúdio, completa seu cadastro rapidinho aqui: '+link);
  const r=await fzapCall('send',{phone:tel,body:msg});
  if(r&&r.ok){ await sb.from('leads').update({link_cadastro_em:new Date().toISOString()}).eq('id',leadId); }
}

async function prepareImage(file){

        audio.play();pp.textContent='⏸'; window._alkeAudio={el:audio,reset:resetUI,mid:mid};

function prettyMsg(t){

  const k=String(t).trim().toLowerCase();
  const map={'[foto]':'📷 Foto','[áudio]':'🎙️ Áudio','[audio]':'🎙️ Áudio','[vídeo]':'🎥 Vídeo','[video]':'🎥 Vídeo','[figurinha]':'🩷 Figurinha','[documento]':'📄 Documento','[localização]':'📍 Localização','[localizacao]':'📍 Localização'};
  return map[k]||t;
}
// hora/data da última mensagem, estilo WhatsApp: hoje=hora, ontem="Ontem", até 7d=dia da semana, mais antigo=data
function fmtWhen(iso){
  if(!iso)return '';
  const d=new Date(iso); if(isNaN(d.getTime()))return '';
  const now=new Date();
  const d0=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const diff=Math.round((t0-d0)/864e5);
  if(diff<=0) return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  if(diff===1) return 'Ontem';
  if(diff<7) return ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][d.getDay()];
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
}

// no celular, redimensiona o overlay pro espaço visível (VisualViewport), pro pop-up ficar acima do teclado
function bindKeyboard(node){
  if(!window.visualViewport) return;
  const vv=window.visualViewport;
  const fit=()=>{ node.style.height=vv.height+'px'; node.style.top=(vv.offsetTop||0)+'px'; node.style.bottom='auto'; };
  vv.addEventListener('resize',fit); vv.addEventListener('scroll',fit); fit();
  try{ const mo=new MutationObserver(()=>{ if(!document.body.contains(node)){vv.removeEventListener('resize',fit);vv.removeEventListener('scroll',fit);mo.disconnect();} }); mo.observe(document.body,{childList:true}); }catch(_){}
}

  const save=EL('button','btn','Salvar');
  save.onclick=async()=>{
    if(pw.value.length<6){msg.textContent='A senha precisa de 6+ caracteres.';msg.style.color='var(--alert)';return;}
    if(mode==='create' && !email.value.includes('@')){msg.textContent='E-mail inválido.';msg.style.color='var(--alert)';return;}
    save.textContent='Salvando…';
    const body=mode==='create'?{action:'create',email:email.value.trim(),password:pw.value,profissional_id:p.id}:{action:'setpassword',user_id:p.user_id,password:pw.value};
    const {data,error}=await sb.functions.invoke('admin-users',{body});
    const err=(data&&data.error)||(error&&error.message);
    if(err){msg.textContent='Erro: '+err;msg.style.color='var(--alert)';save.textContent='Salvar';return;}
    msg.textContent=mode==='create'?'Login criado ✓':'Senha trocada ✓';msg.style.color='var(--win)';
    await loadAll(); setTimeout(()=>{ov.remove();render()},1000);
  };
  act.appendChild(cancel);act.appendChild(save);m.appendChild(act);
  const ov=overlay(m); (mode==='create'?email:pw).focus();
}
function minhaConta(){
  const m=EL('div','modal'); m.appendChild(EL('h3',null,'Minha conta'));
  m.appendChild(EL('p','muted','Trocar a sua senha de acesso.'));
  const p1=inp('password','','nova senha (mín. 6)'); const p2=inp('password','','repetir senha');
  m.appendChild(field('Nova senha',p1)); m.appendChild(field('Repetir',p2));
  const msg=EL('div','muted');msg.style.fontSize='13px';m.appendChild(msg);
  const act=EL('div','mactions');
  const cancel=EL('button','btn ghost','Fechar');cancel.onclick=()=>ov.remove();
  const save=EL('button','btn','Salvar senha');
  save.onclick=async()=>{
    if(p1.value.length<6){msg.textContent='Mínimo 6 caracteres.';msg.style.color='var(--alert)';return;}
    if(p1.value!==p2.value){msg.textContent='As senhas não batem.';msg.style.color='var(--alert)';return;}
    save.textContent='Salvando…';
    const {error}=await sb.auth.updateUser({password:p1.value});
    if(error){msg.textContent='Erro: '+error.message;msg.style.color='var(--alert)';save.textContent='Salvar senha';return;}
    msg.textContent='Senha alterada ✓';msg.style.color='var(--win)';setTimeout(()=>ov.remove(),1200);
  };
  act.appendChild(cancel);act.appendChild(save);m.appendChild(act);
  const ov=overlay(m); p1.focus();
}

// ---------- helpers UI ----------
function inp(type,val,ph){const i=document.createElement('input');i.type=type;if(val!=null)i.value=val;if(ph)i.placeholder=ph;return i}
function sel(opts,val,ph){const s=document.createElement('select');if(ph)s.appendChild(new Option(ph,''));opts.forEach(([v,l])=>s.appendChild(new Option(l,v)));if(val!=null)s.value=val;return s}
function field(label,node){const f=EL('div','f');f.appendChild(EL('label',null,label));f.appendChild(node);return f}
function syncScrollLock(){ document.body.classList.toggle('scroll-locked',!!document.querySelector('.ov')); }
try{ new MutationObserver(syncScrollLock).observe(document.body,{childList:true}); }catch(_){}
function overlay(node){const ov=EL('div','ov');ov.onclick=e=>{if(e.target===ov)ov.remove()};ov.appendChild(node);document.body.appendChild(ov);syncScrollLock();return ov}

boot();
</script>
